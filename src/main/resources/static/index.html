<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutorial Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Tutorial Management System</h1>
            <p class="subtitle">Create, Read, Update, and Delete Tutorials</p>
        </header>

        <div class="main-content">
            <!-- Add/Edit Tutorial Form -->
            <div class="card form-card">
                <h2 id="form-title">➕ Add New Tutorial</h2>
                <form id="tutorial-form">
                    <input type="hidden" id="tutorial-id">
                    
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" id="title" name="title" required placeholder="Enter tutorial title">
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" rows="4" required placeholder="Enter tutorial description"></textarea>
                    </div>

                    <div class="form-group checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="published" name="published">
                            <span>Published</span>
                        </label>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="submit-btn">
                            <span>Add Tutorial</span>
                        </button>
                        <button type="button" class="btn btn-secondary" id="cancel-btn" style="display: none;">
                            <span>Cancel</span>
                        </button>
                    </div>
                </form>
            </div>

            <!-- Search and Filter -->
            <div class="card search-card">
                <h2>🔍 Search Tutorials</h2>
                <div class="search-container">
                    <input type="text" id="search-input" placeholder="Search by title...">
                    <button class="btn btn-primary" id="search-btn">Search</button>
                    <button class="btn btn-secondary" id="show-all-btn">Show All</button>
                </div>
                <div class="filter-buttons">
                    <button class="btn btn-filter" id="show-published-btn">Published Only</button>
                    <button class="btn btn-danger" id="delete-all-btn">Delete All</button>
                </div>
            </div>

            <!-- Tutorials List -->
            <div class="card list-card">
                <h2>📋 Tutorials List</h2>
                <div id="tutorials-list" class="tutorials-grid">
                    <!-- Tutorials will be loaded here dynamically -->
                </div>
                <div id="empty-message" class="empty-message" style="display: none;">
                    <div class="empty-icon">📭</div>
                    <p>No tutorials found. Create your first tutorial!</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for confirmation -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title">Confirm Action</h3>
            <p id="modal-message">Are you sure you want to perform this action?</p>
            <div class="modal-actions">
                <button class="btn btn-danger" id="modal-confirm">Confirm</button>
                <button class="btn btn-secondary" id="modal-cancel">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="js/app.js"></script>
</body>
</html>
